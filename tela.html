<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Summit · Datashow</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
body.showcursor{cursor:default}
[hidden]{display:none!important}
.stage{position:absolute;inset:0;margin:auto;width:100vw;height:20vw;max-height:100vh;max-width:500vh;background:#000;overflow:hidden}
body.fill .stage{width:100vw;height:100vh;max-width:none;max-height:none}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
body.fill .stage video{object-fit:cover}
.ov{mix-blend-mode:screen;opacity:0;transition:opacity .6s ease}
.ov.on{opacity:1}
.ov.cut{transition:none}
.hud{position:fixed;left:16px;bottom:16px;font:600 13px/1.5 system-ui,sans-serif;color:#cfe6d4;background:rgba(0,0,0,.72);border:1px solid #24382d;border-radius:10px;padding:10px 14px;max-width:min(92vw,560px);transition:opacity .4s}
.hud.off{opacity:0;pointer-events:none}
.hud b{color:#a6d63a}
.hud kbd{font:600 12px ui-monospace,Menlo,monospace;border:1px solid #3a5244;border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <video id="fundo" src="tela/fundo.mp4" autoplay muted loop playsinline preload="auto"></video>
</div>
<div class="hud" id="hud">
  <div><b id="hudStatus">Conectando…</b></div>
  <div id="hudNow">Só o fundo</div>
  <div>Clique para tela cheia · <kbd>1</kbd>a<kbd>9</kbd> manda direto · <kbd>0</kbd> volta ao mix · <kbd>P</kbd> preencher · <kbd>H</kbd> mostra este aviso</div>
</div>
<script src="tela-lista.js"></script>
<script src="config.js"></script>
<script type="module" src="tela.js"></script>
</body>
</html>
